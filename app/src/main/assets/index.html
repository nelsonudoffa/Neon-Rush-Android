<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b1a"><title>NEON RUSH</title><style>
*{box-sizing:border-box;touch-action:manipulation}html,body{margin:0;height:100%;overflow:hidden;background:#080b1a;color:white;font-family:system-ui}canvas{display:block;width:100vw;height:100dvh}.hud{position:fixed;top:12px;left:16px;right:16px;pointer-events:none;font-weight:900;letter-spacing:2px}.hud b{color:#44f5ff}.bar{height:5px;background:#ffffff22;margin-top:10px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#44f5ff,#ff4fd8)}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070a16cc;padding:22px}.panel{width:min(420px,100%);text-align:center;padding:28px 22px;border:1px solid #44f5ff88;border-radius:24px;background:linear-gradient(145deg,#131c3df5,#090e23f5)}h1{font-size:clamp(34px,9vw,48px);margin:0;letter-spacing:3px}h1 em{font-style:normal;color:#44f5ff}.sub{color:#b2c3e7;line-height:1.5}.btn{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(90deg,#44f5ff,#a4fbff);font-size:15px;font-weight:900;margin-top:10px;color:#071021}.btn.alt{background:#151f40;color:#e5efff;border:1px solid #465d8d}.levels{display:flex;gap:6px;margin:15px 0}.levels button{flex:1;padding:10px 2px;background:#0c1430;color:#dbe8ff;border:1px solid #41577f;border-radius:10px;font-size:11px}.hint{font-size:11px;color:#8298c7;margin-top:16px}</style></head><body><canvas id="c"></canvas><div class="hud">NEON <b>RUSH</b><div id="lab">LEVEL 01 · TAP TO JUMP</div><div class="bar"><i id="prog"></i></div></div><div id="menu"><div class="panel" id="panel"><h1>NEON <em>RUSH</em></h1><p class="sub">Ride the beat. Dodge the danger.<br>Tap to jump over the neon spikes.</p><button class="btn" id="start">START RUN</button><button class="btn alt" id="choose">CHOOSE LEVEL</button><div class="hint">3 COURSES · ORIGINAL NEON ARCADE ACTION</div></div></div><script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),menu=document.querySelector('#menu'),panel=document.querySelector('#panel'),prog=document.querySelector('#prog'),lab=document.querySelector('#lab');let w,h,g,dpr=1,state='menu',lev=0,run=1,dist=0,last=0,spd=300,py=0,vy=0,rot=0,grounded=true,obs=[],parts=[],audio=null,muted=false;const ls=[{n:'CYBER START',s:290,len:2300,a:'#44f5ff',p:'#ff4fd8',o:[480,710,980,1230,1510,1770,2020,2190]},{n:'PULSE CITY',s:340,len:2800,a:'#a7ff5e',p:'#44f5ff',o:[430,610,830,1080,1320,1570,1830,2070,2350,2610]},{n:'VIOLET OVERDRIVE',s:390,len:3200,a:'#ff4fd8',p:'#ffe66d',o:[390,570,820,1050,1290,1530,1780,2020,2280,2530,2810,3050]}];function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);g=h*.78;if(state!=='play')py=g-27}addEventListener('resize',size);size();function snd(f=480){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(muted)return;let o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;o.connect(a);a.connect(audio.destination);a.gain.setValueAtTime(.035,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.08);o.start();o.stop(audio.currentTime+.08)}catch(e){}}function setup(){dist=0;spd=ls[lev].s;obs=ls[lev].o.map((v,i)=>({v,t:i%4===2?2:1}));py=g-27;vy=0;rot=0;grounded=true;prog.style.width='0%';lab.textContent='LEVEL '+String(lev+1).padStart(2,'0')+' · RUN '+run;state='play';menu.style.display='none';snd()}function showLevels(){panel.innerHTML='<h1>SELECT <em>LEVEL</em></h1><p class="sub">Choose your neon course.</p><div class="levels">'+ls.map((l,i)=>'<button data-l="'+i+'">0'+(i+1)+'<br>'+l.n+'</button>').join('')+'</div><button class="btn" id="go">PLAY LEVEL</button><button class="btn alt" id="back">BACK</button>';panel.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lev=+b.dataset.l;showLevels()});document.querySelector('#go').onclick=setup;document.querySelector('#back').onclick=home}function home(){state='menu';menu.style.display='flex';panel.innerHTML='<h1>NEON <em>RUSH</em></h1><p class="sub">Ride the beat. Dodge the danger.<br>Tap to jump over the neon spikes.</p><button class="btn" id="start">START RUN</button><button class="btn alt" id="choose">CHOOSE LEVEL</button><div class="hint">3 COURSES · ORIGINAL NEON ARCADE ACTION</div>';document.querySelector('#start').onclick=setup;document.querySelector('#choose').onclick=showLevels}function jump(){if(state!=='play')return;if(grounded){vy=-Math.max(470,h*.82);grounded=false;snd(620)}}function finish(win){state=win?'win':'dead';menu.style.display='flex';panel.innerHTML='<h1>'+(win?'LEVEL <em>CLEAR!</em>':'CRASH <em>LANDING</em>')+'</h1><p class="sub">'+(win?'Course complete! Your reflexes are electric.':'You reached '+Math.round(dist/ls[lev].len*100)+'%. The beat is waiting.')+'</p><button class="btn" id="retry">'+(win&&lev<2?'NEXT LEVEL':'PLAY AGAIN')+'</button><button class="btn alt" id="levels">CHOOSE LEVEL</button>';document.querySelector('#retry').onclick=()=>{if(win&&lev<2)lev++;else run++;setup()};document.querySelector('#levels').onclick=showLevels;if(!win)snd(100)}function update(dt){if(state!=='play')return;let l=ls[lev];dist+=spd*dt;prog.style.width=Math.min(100,dist/l.len*100)+'%';vy+=1500*dt;py+=vy*dt;if(py+27>=g){py=g-27;vy=0;grounded=true;rot=Math.round(rot/(Math.PI/2))*(Math.PI/2)}else rot+=dt*5.8;for(let o of obs){let ox=w*.78+o.v-dist,ow=o.t===2?55:30;if(ox<-70||ox>w+80)continue;if(92+22>ox+5&&92<ox+ow-4&&py+22>g-39){finish(false);return}}if(dist>=l.len)finish(true)}function draw(t){let l=ls[lev];x.clearRect(0,0,w,h);let gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#111943');gr.addColorStop(1,'#070a16');x.fillStyle=gr;x.fillRect(0,0,w,h);for(let i=0;i<60;i++){x.fillStyle='rgba(220,248,255,'+(.2+.25*Math.sin(t*.001+i)+.25)+')';x.fillRect((i*137)%w,(i*71)%(h*.7),2,2)}x.strokeStyle=l.a+'24';for(let xx=-(dist*.22%48);xx<w;xx+=48){x.beginPath();x.moveTo(xx,g-70);x.lineTo(xx,g);x.stroke()}for(let yy=g-70;yy<g;yy+=23){x.beginPath();x.moveTo(0,yy);x.lineTo(w,yy);x.stroke()}x.fillStyle='#0b1230';x.fillRect(0,g,w,h-g);x.shadowColor=l.a;x.shadowBlur=14;x.fillStyle=l.a;x.fillRect(0,g,w,3);x.shadowBlur=0;for(let o of obs){let ox=w*.78+o.v-dist;if(ox<-70||ox>w+80)continue;x.fillStyle=l.p;x.shadowColor=l.p;x.shadowBlur=15;for(let k=0;k<o.t;k++){let xx=ox+k*25;x.beginPath();x.moveTo(xx,g);x.lineTo(xx+15,g-35);x.lineTo(xx+30,g);x.fill()}}x.shadowBlur=0;x.save();x.translate(106,py+13.5);x.rotate(rot);x.fillStyle=l.a;x.shadowColor=l.a;x.shadowBlur=20;x.fillRect(-13.5,-13.5,27,27);x.shadowBlur=0;x.strokeStyle='white';x.lineWidth=2;x.strokeRect(-10,-10,20,20);x.fillStyle='#0a1530';x.fillRect(-6,-5,4,4);x.fillRect(3,-5,4,4);x.restore()}function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);c.addEventListener('pointerdown',e=>{if(state==='play'){e.preventDefault();jump()}});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='play')jump();else setup()}});document.querySelector('#start').onclick=setup;document.querySelector('#choose').onclick=showLevels;lab.addEventListener('click',()=>{});})();
</script></body></html>
